# config/database.yml

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: laundry_legends_api_development

test:
  <<: *default
  database: laundry_legends_api_test

production:
  <<: *default
  database: laundry_legends_api_production
  username: laundry_legends_api
  password: <%= ENV["LAUNDRY_LEGENDS_API_DATABASE_PASSWORD"] %>
